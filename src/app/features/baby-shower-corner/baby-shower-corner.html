<section id="cha-de-bebe" class="secao cha" aria-labelledby="cha-titulo">
  <div class="container">
    <div class="cha__moldura moldura-tracejada" mkReveal>
      <div class="cha__texto">
        <span class="fita">Cantinho especial</span>
        <h2 id="cha-titulo">Cantinho feito com amor para o seu chá de bebê</h2>
        <p>
          <mk-heart [size]="18" color="--mk-rosa" /> Reservamos um espacinho só nosso, pensado com carinho para
          ajudar você a montar (ou receber) aquele chá de bebê inesquecível.
        </p>
      </div>

      <svg
        class="cha__ilustracao"
        viewBox="0 0 320 220"
        role="img"
        aria-label="Ilustração de balões coloridos e um bolo sobre uma prateleira, representando o cantinho de chá de bebê"
        xmlns="http://www.w3.org/2000/svg"
      >
        <rect x="26" y="170" width="268" height="12" rx="6" fill="var(--mk-laranja)" opacity="0.45" />

        <g mkLoop="float" [mkLoopDelay]="0">
          <line x1="90" y1="116" x2="90" y2="172" stroke="var(--mk-texto-suave)" stroke-width="2" />
          <circle cx="90" cy="90" r="26" fill="var(--mk-rosa-claro)" />
          <ellipse cx="82" cy="80" rx="6" ry="8" fill="#fff" opacity="0.5" />
        </g>

        <g mkLoop="float" [mkLoopDelay]="260">
          <line x1="152" y1="100" x2="152" y2="172" stroke="var(--mk-texto-suave)" stroke-width="2" />
          <circle cx="152" cy="70" r="30" fill="var(--mk-azul)" />
          <ellipse cx="142" cy="58" rx="7" ry="9" fill="#fff" opacity="0.5" />
        </g>

        <g mkLoop="float" [mkLoopDelay]="500">
          <line x1="212" y1="119" x2="212" y2="172" stroke="var(--mk-texto-suave)" stroke-width="2" />
          <circle cx="212" cy="95" r="24" fill="var(--mk-amarelo)" />
          <ellipse cx="204" cy="86" rx="6" ry="7" fill="#fff" opacity="0.5" />
        </g>

        <rect x="225" y="140" width="60" height="32" rx="9" fill="#fff" stroke="var(--mk-rosa)" stroke-width="2.4" />
        <rect x="238" y="120" width="34" height="24" rx="7" fill="var(--mk-rosa-claro)" stroke="var(--mk-rosa)" stroke-width="2.2" />
        <rect x="252" y="104" width="4" height="16" rx="2" fill="var(--mk-texto-suave)" />
        <ellipse cx="254" cy="100" rx="4.5" ry="6.5" fill="var(--mk-amarelo)" />
      </svg>
    </div>
  </div>
</section>
